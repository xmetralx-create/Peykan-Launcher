name: Build Peykan Launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract project
        run: unzip -q Peykan-Launcher-with-logo.zip

      - name: Build APK
        run: gradle -p JavaCraftFA assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Peykan-Launcher-APK
          path: JavaCraftFA/app/build/outputs/apk/debug/app-debug.apk
